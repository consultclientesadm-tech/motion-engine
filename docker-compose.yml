# Dev local: API + Postgres + Redis + MinIO (S3) + worker de GPU.
# Em produção, o worker roda na GPU alugada (Vast.ai/RunPod) apontando para
# o mesmo Redis/Postgres/S3; os outros serviços ficam num servidor barato.
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: motion, POSTGRES_PASSWORD: motion, POSTGRES_DB: motion}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U motion"], interval: 5s, retries: 10}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: {context: ., dockerfile: docker/Dockerfile.api}
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    env_file: .env
    volumes: [./models:/app/models, workdir:/tmp/motion-engine]
    depends_on: [api]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes: {pgdata: {}, redisdata: {}, miniodata: {}, workdir: {}}
